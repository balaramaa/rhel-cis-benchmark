      failed_when: false
      check_mode: false
    - name: 4.1.5 | Record finding
      ansible.builtin.set_fact:
        rhel10cis_findings: "{{ rhel10cis_findings + [{'id': '4.1.5', 'title': 'Ensure firewalld loopback traffic is configured (manual review - evidence attached)', 'type': 'manual', 'detail': rhel10cis_chk_4_1_5.stdout_lines[:100]}] }}"
      when: rhel10cis_chk_4_1_5.stdout | trim | length > 0
- name: 4.1.6 | Ensure firewalld loopback source address traffic is configured
