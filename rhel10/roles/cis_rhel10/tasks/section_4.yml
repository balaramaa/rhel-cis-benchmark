---
# GENERATED by tools/generate.py - do not edit by hand.
# Section 4 - Host Based Firewall
- name: 4.1.1 | Ensure firewalld is installed
  when: "'4.1.1' in rhel10cis_active_rules"
  tags:
    - rule_4.1.1
    - section_4
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 4.1.1 | PATCH | Ensure packages present
      ansible.builtin.dnf:
        name:
          - firewalld
          - nftables
        state: present
    - name: 4.1.1 | AUDIT | Refresh package facts
      ansible.builtin.package_facts:
        manager: auto
- name: 4.1.2 | Ensure firewalld backend is configured
  when: "'4.1.2' in rhel10cis_active_rules"
  tags:
    - rule_4.1.2
    - section_4
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 4.1.2 | PATCH | FirewallBackend=nftables
      ansible.builtin.lineinfile:
        path: /etc/firewalld/firewalld.conf
        regexp: ^\s*FirewallBackend=
        line: FirewallBackend=nftables
        create: false
        owner: root
        group: root
        mode: '0644'
      notify: rhel10cis reload firewalld
      when: "'firewalld' in ansible_facts.packages"
- name: 4.1.3 | Ensure firewalld.service is configured
  when: "'4.1.3' in rhel10cis_active_rules"
  tags:
    - rule_4.1.3
    - section_4
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 4.1.3 | PATCH | Allow management services in the default zone before enabling
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          command -v firewall-cmd >/dev/null || exit 0
          if systemctl -q is-active firewalld; then fw="firewall-cmd --permanent"; else fw="firewall-offline-cmd"; fi
          for s in {{ rhel10cis_firewalld_allowed_services | join(' ') }}; do
            $fw --query-service="$s" >/dev/null 2>&1 || { echo "CHANGED $s"; [ "$DRY" = 1 ] || $fw --add-service="$s" >/dev/null; }
          done
        executable: /bin/bash
      register: rhel10cis_fix_4_1_3
      changed_when: "'CHANGED' in rhel10cis_fix_4_1_3.stdout"
      check_mode: false
    - name: 4.1.3 | PATCH | Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
        masked: false
      when: "'firewalld' in ansible_facts.packages"
- name: 4.1.4 | Ensure firewalld active zone target is configured
  when: "'4.1.4' in rhel10cis_active_rules"
  tags:
    - rule_4.1.4
    - section_4
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 4.1.4 | PATCH | Change zones with target ACCEPT
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          command -v firewall-cmd >/dev/null || exit 0
          for z in $(firewall-cmd --get-active-zones 2>/dev/null | grep -v '^\s' ); do
            [ "$z" = trusted ] && continue
            if [ "$(firewall-cmd --permanent --zone="$z" --get-target)" = "ACCEPT" ]; then
              echo "CHANGED $z"
              [ "$DRY" = 1 ] || firewall-cmd --permanent --zone="$z" --set-target={{ rhel10cis_firewalld_zone_target }}
            fi
          done
        executable: /bin/bash
      register: rhel10cis_fix_4_1_4
      changed_when: "'CHANGED' in rhel10cis_fix_4_1_4.stdout"
      check_mode: false
      notify: rhel10cis reload firewalld
