- name: 6.2.2.1.2 | Ensure systemd-journal-upload authentication is configured
  when: "'6.2.2.1.2' in rhel10cis_active_rules"
  tags:
    - rule_6.2.2.1.2
    - section_6
    - manual
    - level1_server
    - level1_workstation
  block:
    - name: 6.2.2.1.2 | PATCH | Configure journal-upload (section)
      ansible.builtin.lineinfile:
        path: /etc/systemd/journal-upload.conf
        regexp: ^\[Upload\]\s*$
        line: '[Upload]'
        insertbefore: BOF
        firstmatch: true
        create: true
        mode: '0644'
      when: "rhel10cis_logging_system == 'journald' and rhel10cis_journal_upload_url | length > 0"
      loop: &id001
        - k: URL
          v: '{{ rhel10cis_journal_upload_url }}'
        - k: ServerKeyFile
          v: '{{ rhel10cis_journal_upload_key }}'
        - k: ServerCertificateFile
          v: '{{ rhel10cis_journal_upload_cert }}'
        - k: TrustedCertificateFile
          v: '{{ rhel10cis_journal_upload_ca }}'
    - name: 6.2.2.1.2 | PATCH | Configure journal-upload
      ansible.builtin.lineinfile:
        path: /etc/systemd/journal-upload.conf
        regexp: ^\s*#?\s*{{ item.k }}\s*=
        line: '{{ item.k }}={{ item.v }}'
        insertafter: ^\[Upload\]\s*$
        firstmatch: true
        create: true
        mode: '0644'
      when: "rhel10cis_logging_system == 'journald' and rhel10cis_journal_upload_url | length > 0"
      loop: *id001
    - name: 6.2.2.1.2 | Record finding
      ansible.builtin.set_fact:
        rhel10cis_findings: "{{ rhel10cis_findings + [{'id': '6.2.2.1.2', 'title': 'Ensure systemd-journal-upload authentication is configured', 'type': 'action_required', 'detail': ['Set rhel10cis_journal_upload_url and certificate paths']}] }}"
      when: "rhel10cis_logging_system == 'journald' and rhel10cis_journal_upload_url | length == 0"
