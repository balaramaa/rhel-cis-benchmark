          {% if (['query_module'] | intersect(rhel10cis_syscalls_b32)) | length > 0 %}-a always,exit -F arch=b32 -S {{ (['query_module'] | intersect(rhel10cis_syscalls_b32)) | join(',') }} -F auid>={{ rhel10cis_uid_min }} -F auid!=unset -k kernel_modules{% endif %}
        owner: root
        group: root
        mode: '0640'
      notify: rhel10cis load audit rules
