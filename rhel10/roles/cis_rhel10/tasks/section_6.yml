- name: 6.3.1.2 | Ensure auditing for processes that start prior to auditd is enabled
  when: "'6.3.1.2' in rhel10cis_active_rules"
  tags:
    - rule_6.3.1.2
    - section_6
    - automated
    - level2_server
    - level2_workstation
  block:
    - name: 6.3.1.2 | PATCH | Add kernel argument(s) audit=1
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for a in audit=1; do
            if grubby --info=ALL 2>/dev/null | grep '^args=' | grep -vEq "[\" ]$a[\" ]"; then
              echo "CHANGED $a"; [ "$DRY" = 1 ] || grubby --update-kernel ALL --args="$a"
            fi
          done
        executable: /bin/bash
      register: rhel10cis_fix_6_3_1_2
      changed_when: "'CHANGED' in rhel10cis_fix_6_3_1_2.stdout"
      check_mode: false
      notify: rhel10cis flag reboot
    - name: 6.3.1.2 | PATCH | Persist audit in /etc/default/grub
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX="(?:(?!\baudit=).)*?)"$
        replace: \1 audit=1"
      notify: rhel10cis grub2 mkconfig
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
