# GENERATED by tools/generate.py - do not edit by hand.
# Section 6 - Logging and Auditing
- name: SECTION 6 | PRELIM | Discover supported syscalls and existing audit watch paths
  tags:
    - always
  block:
    - name: SECTION 6 | PRELIM | Dump syscall tables
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: 'for a in b64 b32; do echo "$a: $(ausyscall $a --dump 2>/dev/null | awk ''NR>1{print $2}'' | paste -sd, -)"; done'
      register: rhel10cis_syscalls_raw
      changed_when: false
      check_mode: false
      failed_when: false
    - name: SECTION 6 | PRELIM | Stat audit watch paths
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: '{{ rhel10cis_audit_watch_candidates }}'
      register: rhel10cis_audit_paths_stat
    - name: SECTION 6 | PRELIM | Set syscall and path facts
      ansible.builtin.set_fact:
        rhel10cis_syscalls_b64: "{{ ((rhel10cis_syscalls_raw.stdout_lines | select('match', '^b64:') | first | default('b64: ')).split(': ', 1) | last).split(',') | select | list or rhel10cis_fallback_syscalls }}"
        rhel10cis_syscalls_b32: "{{ ((rhel10cis_syscalls_raw.stdout_lines | select('match', '^b32:') | first | default('b32: ')).split(': ', 1) | last).split(',') | select | list }}"
        rhel10cis_audit_paths: "{{ rhel10cis_audit_paths_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  when: rhel10cis_active_rules | select('match', '^6\.') | list | length > 0
- name: 6.1.1 | Ensure AIDE is installed
  when: "'6.1.1' in rhel10cis_active_rules"
  tags:
    - rule_6.1.1
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.1 | PATCH | Ensure packages present
      ansible.builtin.dnf:
        name:
          - aide
        state: present
    - name: 6.1.1 | PATCH | Initialise the AIDE database (can take several minutes)
      ansible.builtin.shell: aide --init && mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      args:
        creates: /var/lib/aide/aide.db.gz
      async: 3600
      poll: 15
      when: not ansible_check_mode
    - name: 6.1.1 | Record finding
      ansible.builtin.set_fact:
        rhel10cis_findings: "{{ rhel10cis_findings + [{'id': '6.1.1', 'title': 'Ensure AIDE is installed', 'type': 'info', 'detail': ['Dry run: the AIDE database is created on the real run (takes several minutes)']}] }}"
      when: ansible_check_mode
- name: 6.1.2 | Ensure filesystem integrity is regularly checked
  when: "'6.1.2' in rhel10cis_active_rules"
  tags:
    - rule_6.1.2
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.2 | PATCH | aidecheck.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.service
        mode: '0644'
        content: |
          [Unit]
          Description=Aide Check

          [Service]
          Type=simple
          ExecStart=/usr/sbin/aide --check

          [Install]
          WantedBy=multi-user.target
    - name: 6.1.2 | PATCH | aidecheck.timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Aide check every day at 5AM

          [Timer]
          OnCalendar={{ rhel10cis_aide_schedule }}
          Unit=aidecheck.service

          [Install]
          WantedBy=multi-user.target
    - name: 6.1.2 | PATCH | Enable aidecheck.timer
      ansible.builtin.systemd:
        name: aidecheck.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
- name: 6.1.3 | Ensure cryptographic mechanisms are used to protect the integrity of audit tools
  when: "'6.1.3' in rhel10cis_active_rules"
  tags:
    - rule_6.1.3
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.3 | PATCH | Protect audit tools in aide.conf
      ansible.builtin.blockinfile:
        path: /etc/aide.conf
        marker: '# {mark} CIS audit tools'
        block: |-
          # Audit Tools
          /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
