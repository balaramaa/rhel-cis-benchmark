        rhel10cis_findings: "{{ rhel10cis_findings + [{'id': '6.2.1.2', 'title': 'Ensure journald log file access is configured (manual review - evidence attached)', 'type': 'manual', 'detail': rhel10cis_chk_6_2_1_2.stdout_lines[:100]}] }}"
      when: rhel10cis_chk_6_2_1_2.stdout | trim | length > 0
