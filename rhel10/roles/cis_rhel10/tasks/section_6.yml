- name: 6.2.3.7 | Ensure rsyslog is not configured to receive logs from a remote client
  when: "'6.2.3.7' in rhel10cis_active_rules"
  tags:
    - rule_6.2.3.7
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.2.3.7 | PATCH | Comment out imtcp/imudp inputs
      ansible.builtin.shell:
        cmd: grep -lPrs '^\s*(module\(load="?im(tcp|udp)"?|input\(type="?im(tcp|udp)"?|\$ModLoad\s+im(tcp|udp)|\$(InputTCPServerRun|UDPServerRun))' /etc/rsyslog.conf /etc/rsyslog.d/ | while read -r f; do echo CHANGED $f; [ "$DRY" = 1 ] || sed -ri '/^\s*(module\(load="?im(tcp|udp)"?|input\(type="?im(tcp|udp)"?|\$ModLoad\s+im(tcp|udp)|\$(InputTCPServerRun|UDPServerRun))/s/^/# /' "$f"; done
        executable: /bin/bash
      environment:
        DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
      register: rhel10cis_rsin_6_2_3_7
      changed_when: "'CHANGED' in rhel10cis_rsin_6_2_3_7.stdout"
      check_mode: false
      when: "rhel10cis_logging_system == 'rsyslog' and not rhel10cis_rsyslog_is_log_server | bool"
      notify: rhel10cis restart rsyslog
