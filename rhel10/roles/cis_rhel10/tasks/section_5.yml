- name: 5.2.4 | Ensure users must provide password for escalation
  when: "'5.2.4' in rhel10cis_active_rules"
  tags:
    - rule_5.2.4
    - section_5
    - automated
    - level2_server
    - level2_workstation
  block:
    - name: 5.2.4 | AUDIT | Collect evidence
      ansible.builtin.shell:
        cmd: "grep -rP '^[^#].*NOPASSWD' /etc/sudoers /etc/sudoers.d/ || true"
        executable: /bin/bash
      register: rhel10cis_chk_5_2_4
      changed_when: false
      failed_when: false
      check_mode: false
    - name: 5.2.4 | Record finding
      ansible.builtin.set_fact:
        rhel10cis_findings: "{{ rhel10cis_findings + [{'id': '5.2.4', 'title': 'Ensure users must provide password for escalation', 'type': 'action_required', 'detail': rhel10cis_chk_5_2_4.stdout_lines[:100]}] }}"
      when: rhel10cis_chk_5_2_4.stdout | trim | length > 0
    - name: 5.2.4 | PATCH | Remove NOPASSWD (opt-in, can break automation accounts)
      ansible.builtin.shell:
        cmd: for f in /etc/sudoers /etc/sudoers.d/*; do grep -q NOPASSWD "$f" && sed -ri 's/NOPASSWD:\s*//g' "$f" && visudo -cf "$f" && echo CHANGED; done; true
        executable: /bin/bash
      register: rhel10cis_nopw_5_2_4
      changed_when: "'CHANGED' in rhel10cis_nopw_5_2_4.stdout"
      when: rhel10cis_sudo_remove_nopasswd | bool and not ansible_check_mode
- name: 5.2.5 | Ensure re-authentication for privilege escalation is not disabled globally
  when: "'5.2.5' in rhel10cis_active_rules"
  tags:
    - rule_5.2.5
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.2.5 | PATCH | Remove !authenticate tags
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for f in /etc/sudoers /etc/sudoers.d/*; do
            [ -f "$f" ] || continue
            if grep -Eq '^[^#].*!authenticate' "$f"; then
              echo "CHANGED $f"
              [ "$DRY" = 1 ] || { cp -a "$f" "/root/$(basename "$f").cis-bak"; sed -ri '/^[^#].*!authenticate/s/^/# /' "$f"; visudo -cf "$f" >/dev/null || cp -a "/root/$(basename "$f").cis-bak" "$f"; }
            fi
          done
        executable: /bin/bash
      register: rhel10cis_fix_5_2_5
      changed_when: "'CHANGED' in rhel10cis_fix_5_2_5.stdout"
      check_mode: false
