    - rule_5.4.1.1
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.4.1.1 | PATCH | PASS_MAX_DAYS {{ rhel10cis_pass_max_days }}
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: ^\s*#?\s*PASS_MAX_DAYS\s
        line: PASS_MAX_DAYS {{ rhel10cis_pass_max_days }}
        create: false
        owner: root
        group: root
        mode: '0644'
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
    - name: 5.4.1.1 | PATCH | Apply --maxdays {{ rhel10cis_pass_max_days }} to existing users
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          [ "{{ rhel10cis_apply_to_existing_users | bool }}" = "True" ] || exit 0
          awk -F: '($2 ~ /^\$.+\$/) { if ($5 > {{ rhel10cis_pass_max_days }} || $5 < 1) print $1 }' /etc/shadow | while read -r u; do
            echo "CHANGED $u"; [ "$DRY" = 1 ] || chage --maxdays {{ rhel10cis_pass_max_days }} "$u"
          done
        executable: /bin/bash
      register: rhel10cis_fix_5_4_1_1
      changed_when: "'CHANGED' in rhel10cis_fix_5_4_1_1.stdout"
      check_mode: false
