      when: rhel10cis_chk_5_4_2_4.stdout | trim | length > 0
- name: 5.4.2.5 | Ensure root path integrity
  when: "'5.4.2.5' in rhel10cis_active_rules"
  tags:
    - rule_5.4.2.5
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.4.2.5 | AUDIT | Collect evidence
      ansible.builtin.shell:
        cmd: |-
          p=$(sudo -Hiu root env | grep '^PATH' | cut -d= -f2)
          echo "$p" | grep -q '::' && echo 'Empty directory in PATH (::)'
          echo "$p" | grep -Pq ':\h*$' && echo 'Trailing : in PATH'
          for d in $(echo "$p" | tr ':' ' '); do
            if [ -d "$d" ]; then
              [ "$(stat -Lc '%U' "$d")" = root ] || echo "$d not owned by root"
              [ $(( 0$(stat -Lc '%a' "$d") & 022 )) -eq 0 ] || echo "$d is group/world writable"
            else echo "$d is not a directory"; fi
          done
        executable: /bin/bash
      register: rhel10cis_chk_5_4_2_5
      changed_when: false
      failed_when: false
      check_mode: false
    - name: 5.4.2.5 | Record finding
      ansible.builtin.set_fact:
        rhel10cis_findings: "{{ rhel10cis_findings + [{'id': '5.4.2.5', 'title': 'Ensure root path integrity', 'type': 'audit', 'detail': rhel10cis_chk_5_4_2_5.stdout_lines[:100]}] }}"
      when: rhel10cis_chk_5_4_2_5.stdout | trim | length > 0
- name: 5.4.2.6 | Ensure root user umask is configured
  when: "'5.4.2.6' in rhel10cis_active_rules"
  tags:
    - rule_5.4.2.6
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.4.2.6 | PATCH | Comment weak umask in root dotfiles
      ansible.builtin.replace:
        path: '{{ item }}'
        regexp: ^(\s*umask\s+0?([0-7][0-6][0-6]|[0-7][0-1][0-7]|[0-7][0-7][0-6]))\s*$
        replace: '# \1'
      loop:
        - /root/.bash_profile
        - /root/.bashrc
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
      register: cis_edit_result
- name: 5.4.2.7 | Ensure system accounts do not have a valid login shell
  when: "'5.4.2.7' in rhel10cis_active_rules"
  tags:
    - rule_5.4.2.7
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.4.2.7 | PATCH | Set nologin for system accounts
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          uid_min=$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)
          valid="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' -))$"
          awk -v pat="$valid" -v m="$uid_min" -F: '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3<m || $3==65534) && $NF~pat) {print $1}' /etc/passwd |
          while read -r u; do echo "CHANGED $u"; [ "$DRY" = 1 ] || usermod -s "$(command -v nologin)" "$u"; done
        executable: /bin/bash
      register: rhel10cis_fix_5_4_2_7
      changed_when: "'CHANGED' in rhel10cis_fix_5_4_2_7.stdout"
      check_mode: false
- name: 5.4.2.8 | Ensure accounts without a valid login shell are locked
  when: "'5.4.2.8' in rhel10cis_active_rules"
  tags:
    - rule_5.4.2.8
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.4.2.8 | PATCH | Lock non-root accounts without a valid shell
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          valid="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' -))$"
          awk -v pat="$valid" -F: '($1 != "root" && $NF !~ pat) {print $1}' /etc/passwd | while read -r u; do
            passwd -S "$u" | awk '$2 !~ /^L/ {exit 1}' || { echo "CHANGED $u"; [ "$DRY" = 1 ] || usermod -L "$u"; }
          done
        executable: /bin/bash
      register: rhel10cis_fix_5_4_2_8
      changed_when: "'CHANGED' in rhel10cis_fix_5_4_2_8.stdout"
      check_mode: false
- name: 5.4.3.1 | Ensure nologin is not listed in /etc/shells
  when: "'5.4.3.1' in rhel10cis_active_rules"
  tags:
    - rule_5.4.3.1
    - section_5
    - automated
    - level2_server
    - level2_workstation
  block:
    - name: 5.4.3.1 | PATCH | Remove nologin from /etc/shells
      ansible.builtin.lineinfile:
        path: /etc/shells
        regexp: ^.*/nologin\s*$
        state: absent
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
- name: 5.4.3.2 | Ensure default user shell timeout is configured
  when: "'5.4.3.2' in rhel10cis_active_rules"
  tags:
    - rule_5.4.3.2
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.4.3.2 | PATCH | Set TMOUT
      ansible.builtin.copy:
        dest: /etc/profile.d/50-cis-tmout.sh
        content: |
          # Managed by Ansible - CIS
          TMOUT={{ rhel10cis_shell_timeout }}
          readonly TMOUT
          export TMOUT
        owner: root
        group: root
        mode: '0644'
- name: 5.4.3.3 | Ensure default user umask is configured
  when: "'5.4.3.3' in rhel10cis_active_rules"
  tags:
    - rule_5.4.3.3
    - section_5
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 5.4.3.3 | PATCH | Comment out weak umask in shell init files
      ansible.builtin.shell:
        cmd: for f in /etc/profile /etc/bashrc /etc/profile.d/*.sh; do [ -f "$f" ] || continue; if grep -Pq '^\s*umask\s+0?(0[01][0-7]|0[0-7][0-6]|[0-7][0-7][0-6])\b' "$f" && [ "$f" != /etc/profile.d/50-cis-umask.sh ]; then echo CHANGED $f; [ "$DRY" = 1 ] || sed -ri '/^\s*umask\s+0?(0[01][0-7]|0[0-7][0-6]|[0-7][0-7][0-6])\b/s/^/# /' "$f"; fi; done
        executable: /bin/bash
      environment:
        DRY: "{{ ansible_check_mode | ternary('1', '0') }}"
      register: rhel10cis_umask_5_4_3_3
      changed_when: "'CHANGED' in rhel10cis_umask_5_4_3_3.stdout"
      check_mode: false
    - name: 5.4.3.3 | PATCH | Set default umask
      ansible.builtin.copy:
        dest: /etc/profile.d/50-cis-umask.sh
        content: |
          # Managed by Ansible - CIS
          umask {{ rhel10cis_umask }}
        owner: root
        group: root
        mode: '0644'
    - name: 5.4.3.3 | PATCH | UMASK {{ rhel10cis_umask }}
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: ^\s*#?\s*UMASK\s
        line: UMASK {{ rhel10cis_umask }}
        create: false
        owner: root
        group: root
        mode: '0644'
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
