---
# =============================================================================
#  cis_rhel10 defaults - CIS Red Hat Enterprise Linux 10 Benchmark v1.0.1
#  Override in group_vars/host_vars or with -e. Variables are prefixed with
#  "rhel10cis_" because control IDs differ between RHEL 8, 9 and 10.
# =============================================================================

# ----------------------------------------------------------------- profile
rhel10cis_level: 1                 # 1 = Level 1 only, 2 = Level 1 + Level 2
rhel10cis_profile: server          # server | workstation
rhel10cis_include_manual: true     # collect evidence for Manual controls in the report

# ------------------------------------------------------- selecting controls
# Any of these can be combined. IDs refer to THIS benchmark (v1.0.1).
rhel10cis_skip_rules: []           # e.g. ['1.1.1.6', '5.1.20']
rhel10cis_skip_sections: []        # e.g. ['6.3'] skips every 6.3.x control, ['2'] all of section 2
rhel10cis_only_rules: []           # if non-empty, ONLY these controls run

# ---------------------------------------------------------------- reporting
rhel10cis_write_report: true
rhel10cis_report_dir: /root
rhel10cis_report_fetch: true
rhel10cis_report_fetch_dir: "{{ playbook_dir }}/reports"

# ---------------------------------------------------------------- section 1
rhel10cis_enable_repo_gpgcheck: false     # Red Hat CDN does not sign repodata; enable only if every repo supports it
rhel10cis_apply_updates: false            # run 'dnf update' for the patching control
rhel10cis_selinux_policy: targeted
rhel10cis_bootloader_password_hash: ""    # output of grub2-mkpasswd-pbkdf2 (grub.pbkdf2.sha512...)
rhel10cis_grub_dir: /boot/grub2
rhel10cis_sysctl_file: /etc/sysctl.d/99-zz-cis-hardening.conf
rhel10cis_crypto_policy_base: DEFAULT
rhel10cis_ssh_terrapin_mitigation: false  # true = also disable chacha20/EtM via crypto policy (if OpenSSH < 9.6 unpatched)
rhel10cis_banner_motd: |
  Authorized users only. All activity may be monitored and reported.
rhel10cis_banner_issue: |
  Authorized users only. All activity may be monitored and reported.
rhel10cis_banner_issue_net: |
  Authorized users only. All activity may be monitored and reported.
rhel10cis_gdm_banner_text: "Authorized users only. All activity may be monitored and reported."
rhel10cis_gdm_idle_delay: 900
rhel10cis_gdm_lock_delay: 5

# ---------------------------------------------------------------- section 2
rhel10cis_service_remediation: mask       # mask = stop+mask units (keeps packages); remove = uninstall packages
rhel10cis_time_sources:
  - "pool 2.rhel.pool.ntp.org iburst"

# ---------------------------------------------------------------- section 4
rhel10cis_firewalld_allowed_services: [ssh]  # opened in the default zone BEFORE firewalld is enabled
rhel10cis_firewalld_zone_target: default     # used when an active zone has target ACCEPT (default | DROP | %REJECT%)
rhel10cis_firewalld_log_denied: all

# ---------------------------------------------------------------- section 5
# SSH - review these before running against remote hosts!
rhel10cis_sshd_permit_root_login: "no"
rhel10cis_sshd_allowusers: []
rhel10cis_sshd_allowgroups: []            # e.g. ['wheel', 'sshusers'] - left empty to avoid lock-out
rhel10cis_sshd_denyusers: []
rhel10cis_sshd_denygroups: []
rhel10cis_sshd_client_alive_interval: 15
rhel10cis_sshd_client_alive_count_max: 3
rhel10cis_sshd_login_grace_time: 60
rhel10cis_sshd_log_level: VERBOSE
rhel10cis_sshd_max_auth_tries: 4
rhel10cis_sshd_max_startups: "10:30:60"
rhel10cis_sshd_max_sessions: 10
rhel10cis_sshd_weak_ciphers: [3des-cbc, aes128-cbc, aes192-cbc, aes256-cbc, rijndael-cbc@lysator.liu.se]
rhel10cis_sshd_weak_kex: [diffie-hellman-group1-sha1, diffie-hellman-group14-sha1, diffie-hellman-group-exchange-sha1]
rhel10cis_sshd_weak_macs: [hmac-md5, hmac-md5-96, hmac-ripemd160, hmac-sha1-96, umac-64@openssh.com, umac-128@openssh.com, hmac-md5-etm@openssh.com, hmac-md5-96-etm@openssh.com, hmac-ripemd160-etm@openssh.com, hmac-sha1-96-etm@openssh.com, umac-64-etm@openssh.com, umac-128-etm@openssh.com]
# sudo
rhel10cis_sudo_logfile: /var/log/sudo.log
rhel10cis_sudo_timestamp_timeout: 15
rhel10cis_sudo_remove_nopasswd: false     # true removes NOPASSWD everywhere - can break automation accounts
rhel10cis_su_group: sugroup
# PAM / authselect
rhel10cis_update_pam_packages: false      # true = 'latest' for pam/authselect/libpwquality
rhel10cis_authselect_create_custom: true  # create + select custom/<profile> when the host uses a stock profile
rhel10cis_authselect_profile: cis-profile
rhel10cis_authselect_default_base: local
rhel10cis_faillock_deny: 5
rhel10cis_faillock_unlock_time: 900
rhel10cis_faillock_root_unlock_time: 60
rhel10cis_pwquality_difok: 2
rhel10cis_pwquality_minlen: 14
rhel10cis_pwquality_maxrepeat: 3
rhel10cis_pwquality_maxsequence: 3
rhel10cis_pwquality_minclass: 4
rhel10cis_pwhistory_remember: 24
rhel10cis_password_hash: YESCRYPT
# accounts
rhel10cis_pass_max_days: 365
rhel10cis_pass_min_days: 1
rhel10cis_pass_warn_age: 7
rhel10cis_inactive_days: 45
rhel10cis_apply_to_existing_users: true   # also run chage on existing accounts
rhel10cis_shell_timeout: 900
rhel10cis_umask: "027"

# ---------------------------------------------------------------- section 6
rhel10cis_logging_system: rsyslog         # rsyslog | journald (CIS asks you to pick one)
rhel10cis_rsyslog_is_log_server: false
rhel10cis_rsyslog_remote_host: ""
rhel10cis_rsyslog_remote_port: 514
rhel10cis_rsyslog_remote_protocol: tcp
rhel10cis_rsyslog_tls: false
rhel10cis_rsyslog_tls_ca: /etc/pki/tls/certs/ca.pem
rhel10cis_journal_upload_url: ""
rhel10cis_journal_upload_key: /etc/ssl/private/journal-upload.pem
rhel10cis_journal_upload_cert: /etc/ssl/certs/journal-upload.pem
rhel10cis_journal_upload_ca: /etc/ssl/ca/trusted.pem
rhel10cis_aide_schedule: "*-*-* 05:00:00"
rhel10cis_aide_syslog_facility: LOG_LOCAL0
rhel10cis_audit_backlog_limit: 8192
rhel10cis_auditd_max_log_file: 8
rhel10cis_auditd_disk_full_action: halt         # halt | single
rhel10cis_auditd_disk_error_action: halt        # syslog | single | halt
rhel10cis_auditd_space_left_action: email
rhel10cis_auditd_admin_space_left_action: single
rhel10cis_audit_log_group: root
rhel10cis_fallback_syscalls: [execve, adjtimex, settimeofday, clock_settime, sethostname, setdomainname, creat, open, openat, truncate, ftruncate, chmod, fchmod, fchmodat, fchmodat2, chown, fchown, lchown, fchownat, setxattr, lsetxattr, fsetxattr, removexattr, lremovexattr, fremovexattr, mount, unlink, unlinkat, rename, renameat, renameat2, init_module, finit_module, delete_module, create_module, query_module]

# ---------------------------------------------------------------- section 7
rhel10cis_remove_forward_rhosts: false

