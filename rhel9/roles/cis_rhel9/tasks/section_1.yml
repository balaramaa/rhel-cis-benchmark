      ansible.builtin.shell:
        cmd: "lsmod | awk 'NR>1{print $1}' | sort ; echo 'MANUAL REVIEW REQUIRED'"
        executable: /bin/bash
      register: rhel9cis_chk_1_1_1_11
      changed_when: false
      failed_when: false
      check_mode: false
    - name: 1.1.1.11 | Record finding
      ansible.builtin.set_fact:
        rhel9cis_findings: "{{ rhel9cis_findings + [{'id': '1.1.1.11', 'title': 'Ensure unused filesystems kernel modules are not available (manual review - evidence attached)', 'type': 'manual', 'detail': rhel9cis_chk_1_1_1_11.stdout_lines[:100]}] }}"
      when: rhel9cis_chk_1_1_1_11.stdout | trim | length > 0
- name: 1.1.2.1.1 | Ensure /tmp is tmpfs or a separate partition
  when: "'1.1.2.1.1' in rhel9cis_active_rules"
  tags:
    - rule_1.1.2.1.1
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.1.2.1.1 | Record finding
      ansible.builtin.set_fact:
        rhel9cis_findings: "{{ rhel9cis_findings + [{'id': '1.1.2.1.1', 'title': 'Ensure /tmp is tmpfs or a separate partition', 'type': 'action_required', 'detail': ['/tmp is not a separate mount - repartition or configure a mount (cannot be automated safely)']}] }}"
      when: "'/tmp' not in (ansible_facts.mounts | map(attribute='mount') | list)"
- name: 1.1.2.1.2 | Ensure nodev option set on /tmp partition
  when: "'1.1.2.1.2' in rhel9cis_active_rules"
  tags:
    - rule_1.1.2.1.2
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.1.2.1.2 | AUDIT | Check that /tmp is an fstab entry
      ansible.builtin.command: grep -Eq '^\s*[^#[:space:]]+\s+/tmp\s' /etc/fstab
      register: rhel9cis_fstab_1_1_2_1_2
      changed_when: false
      failed_when: rhel9cis_fstab_1_1_2_1_2.rc > 1
      check_mode: false
    - name: 1.1.2.1.2 | PATCH | Add nodev to /tmp in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: ^(\s*[^#\s]\S*\s+/tmp\s+\S+\s+)(?!(?:\S*,)?nodev(?:,|\s))(\S+)(.*)$
        replace: \1\2,nodev\3
      when:
        - rhel9cis_fstab_1_1_2_1_2.rc == 0
        - "'/tmp' in (ansible_facts.mounts | map(attribute='mount') | list)"
      notify: rhel9cis remount /tmp
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
    - name: 1.1.2.1.2 | Record finding
      ansible.builtin.set_fact:
        rhel9cis_findings: "{{ rhel9cis_findings + [{'id': '1.1.2.1.2', 'title': 'Ensure nodev option set on /tmp partition', 'type': 'info', 'detail': ['/tmp is not a separate partition in /etc/fstab - option not applicable or set it on the systemd mount unit']}] }}"
      when: "rhel9cis_fstab_1_1_2_1_2.rc != 0 and '/tmp' != '/dev/shm'"
