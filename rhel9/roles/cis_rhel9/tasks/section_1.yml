  when: "'1.3.1.5' in rhel9cis_active_rules"
  tags:
    - rule_1.3.1.5
    - section_1
    - automated
    - level2_server
    - level2_workstation
  block:
    - name: 1.3.1.5 | PATCH | SELINUX=enforcing
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: ^\s*SELINUX=
        line: SELINUX=enforcing
        create: false
        owner: root
        group: root
        mode: '0644'
      register: cis_edit_result
