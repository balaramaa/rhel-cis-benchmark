        state: present
- name: 1.3.1.2 | Ensure SELinux is not disabled in bootloader configuration
  when: "'1.3.1.2' in rhel9cis_active_rules"
  tags:
    - rule_1.3.1.2
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.3.1.2 | PATCH | Remove kernel argument(s) selinux=0 enforcing=0
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for a in selinux enforcing; do
            if grubby --info=ALL 2>/dev/null | grep '^args=' | grep -Eq "[\" ]$a(=[^ \"]*)?[\" ]"; then
              echo "CHANGED $a"; [ "$DRY" = 1 ] || grubby --update-kernel ALL --remove-args="$a"
            fi
          done
        executable: /bin/bash
      register: rhel9cis_fix_1_3_1_2
      changed_when: "'CHANGED' in rhel9cis_fix_1_3_1_2.stdout"
      check_mode: false
      notify: rhel9cis flag reboot
    - name: 1.3.1.2 | PATCH | Remove selinux=0 / enforcing=0 from /etc/default/grub
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: \s*(selinux|enforcing)=0
      notify: rhel9cis grub2 mkconfig
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
- name: 1.3.1.3 | Ensure SELinux policy is configured
  when: "'1.3.1.3' in rhel9cis_active_rules"
  tags:
    - rule_1.3.1.3
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.3.1.3 | PATCH | SELINUXTYPE={{ rhel9cis_selinux_policy }}
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: ^\s*SELINUXTYPE=
        line: SELINUXTYPE={{ rhel9cis_selinux_policy }}
        create: false
        owner: root
        group: root
        mode: '0644'
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
- name: 1.3.1.4 | Ensure the SELinux mode is not disabled
  when: "'1.3.1.4' in rhel9cis_active_rules"
  tags:
    - rule_1.3.1.4
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.3.1.4 | PATCH | Change SELINUX=disabled to permissive (reboot + relabel required)
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: ^(\s*)SELINUX=disabled\s*$
        replace: \1SELINUX=permissive
      notify: rhel9cis flag reboot
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
