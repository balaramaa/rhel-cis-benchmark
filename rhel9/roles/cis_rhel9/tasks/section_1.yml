- name: 1.4.5 | Ensure systemd ability to spawn an interactive boot process is disabled
  when: "'1.4.5' in rhel9cis_active_rules"
  tags:
    - rule_1.4.5
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.4.5 | PATCH | Remove kernel argument(s) systemd.confirm_spawn
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for a in systemd.confirm_spawn; do
            if grubby --info=ALL 2>/dev/null | grep '^args=' | grep -Eq "[\" ]$a(=[^ \"]*)?[\" ]"; then
              echo "CHANGED $a"; [ "$DRY" = 1 ] || grubby --update-kernel ALL --remove-args="$a"
            fi
          done
        executable: /bin/bash
      register: rhel9cis_fix_1_4_5
      changed_when: "'CHANGED' in rhel9cis_fix_1_4_5.stdout"
      check_mode: false
      notify: rhel9cis flag reboot
    - name: 1.4.5 | PATCH | Remove systemd.confirm_spawn from /etc/default/grub
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: \s*systemd\.confirm_spawn(=\S+)?
      notify: rhel9cis grub2 mkconfig
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
