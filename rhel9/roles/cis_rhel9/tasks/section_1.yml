        firstmatch: true
        create: true
        mode: '0644'
      when: rhel9cis_enable_repo_gpgcheck | bool
    - name: 1.2.1.3 | PATCH | Enable repo_gpgcheck globally (opt-in)
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: ^\s*#?\s*repo_gpgcheck\s*=
        line: repo_gpgcheck=1
        insertafter: ^\[main\]\s*$
        firstmatch: true
        create: true
        mode: '0644'
      when: rhel9cis_enable_repo_gpgcheck | bool
    - name: 1.2.1.3 | Record finding
