- name: 1.2.1.1 | Ensure GPG keys are configured
  when: "'1.2.1.1' in rhel9cis_active_rules"
  tags:
    - rule_1.2.1.1
    - section_1
    - manual
    - level1_server
    - level1_workstation
  block:
    - name: 1.2.1.1 | AUDIT | Collect evidence
      ansible.builtin.shell:
        cmd: rpm -q gpg-pubkey --qf '%{NAME}-%{VERSION}-%{RELEASE}\t%{SUMMARY}\n' ; echo 'MANUAL REVIEW REQUIRED'
        executable: /bin/bash
      register: rhel9cis_chk_1_2_1_1
      changed_when: false
      failed_when: false
      check_mode: false
    - name: 1.2.1.1 | Record finding
      ansible.builtin.set_fact:
        rhel9cis_findings: "{{ rhel9cis_findings + [{'id': '1.2.1.1', 'title': 'Ensure GPG keys are configured (manual review - evidence attached)', 'type': 'manual', 'detail': rhel9cis_chk_1_2_1_1.stdout_lines[:100]}] }}"
      when: rhel9cis_chk_1_2_1_1.stdout | trim | length > 0
- name: 1.2.1.2 | Ensure gpgcheck is configured
  when: "'1.2.1.2' in rhel9cis_active_rules"
  tags:
    - rule_1.2.1.2
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.2.1.2 | PATCH | Enable gpgcheck globally (section)
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: ^\[main\]\s*$
        line: '[main]'
        insertbefore: BOF
        firstmatch: true
        create: true
        mode: '0644'
    - name: 1.2.1.2 | PATCH | Enable gpgcheck globally
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: ^\s*#?\s*gpgcheck\s*=
        line: gpgcheck=1
        insertafter: ^\[main\]\s*$
        firstmatch: true
        create: true
        mode: '0644'
    - name: 1.2.1.2 | AUDIT | Find repo files
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: '*.repo'
      register: rhel9cis_repos_1_2_1_2
    - name: 1.2.1.2 | PATCH | Set gpgcheck=1 in every repo file
      ansible.builtin.replace:
        path: '{{ item.path }}'
        regexp: ^\s*gpgcheck\s*=\s*(0|false|no)\s*$
        replace: gpgcheck=1
      loop: '{{ rhel9cis_repos_1_2_1_2.files }}'
      loop_control:
        label: '{{ item.path }}'
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
