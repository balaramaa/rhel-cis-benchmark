- name: 1.8.1 | Ensure GDM login banner is configured
  when: "'1.8.1' in rhel9cis_active_rules"
  tags:
    - rule_1.8.1
    - section_1
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 1.8.1 | GDM is installed
      when: "'gdm' in ansible_facts.packages"
      block:
        - name: "1.8.1 | PATCH | dconf profile 'gdm' (directory)"
          ansible.builtin.file:
            path: /etc/dconf/profile
            state: directory
            owner: root
            group: root
            mode: '0755'
        - name: "1.8.1 | PATCH | dconf profile 'gdm'"
          ansible.builtin.copy:
            dest: /etc/dconf/profile/gdm
            content: |
              user-db:user
              system-db:gdm
              file-db:/usr/share/gdm/greeter-dconf-defaults
            mode: '0644'
          register: cis_copy_result
          failed_when: "cis_copy_result is failed and not (ansible_check_mode and 'does not exist' in (cis_copy_result.msg | default('')))"
        - name: 1.8.1 | PATCH | Login banner (directory)
          ansible.builtin.file:
            path: /etc/dconf/db/gdm.d
            state: directory
            owner: root
            group: root
            mode: '0755'
        - name: 1.8.1 | PATCH | Login banner
          ansible.builtin.copy:
            dest: /etc/dconf/db/gdm.d/01-banner-message
            content: |
              [org/gnome/login-screen]
              banner-message-enable=true
              banner-message-text='{{ rhel9cis_gdm_banner_text }}'
            owner: root
            group: root
            mode: '0644'
          notify: rhel9cis dconf update
          register: cis_copy_result
          failed_when: "cis_copy_result is failed and not (ansible_check_mode and 'does not exist' in (cis_copy_result.msg | default('')))"
        - name: 1.8.1 | PATCH | Lock settings (directory)
          ansible.builtin.file:
            path: /etc/dconf/db/gdm.d/locks
            state: directory
            owner: root
            group: root
            mode: '0755'
        - name: 1.8.1 | PATCH | Lock settings
          ansible.builtin.copy:
            dest: /etc/dconf/db/gdm.d/locks/01-banner-message
            content: |
              /org/gnome/login-screen/banner-message-enable
              /org/gnome/login-screen/banner-message-text
            owner: root
            group: root
            mode: '0644'
          notify: rhel9cis dconf update
          register: cis_copy_result
          failed_when: "cis_copy_result is failed and not (ansible_check_mode and 'does not exist' in (cis_copy_result.msg | default('')))"
