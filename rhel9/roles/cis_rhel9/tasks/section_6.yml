# GENERATED by tools/generate.py - do not edit by hand.
# Section 6 - Logging and Auditing
- name: SECTION 6 | PRELIM | Discover supported syscalls and existing audit watch paths
  tags:
    - always
  block:
    - name: SECTION 6 | PRELIM | Dump syscall tables
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: 'for a in b64 b32; do echo "$a: $(ausyscall $a --dump 2>/dev/null | awk ''NR>1{print $2}'' | paste -sd, -)"; done'
      register: rhel9cis_syscalls_raw
      changed_when: false
      check_mode: false
      failed_when: false
    - name: SECTION 6 | PRELIM | Stat audit watch paths
      ansible.builtin.stat:
        path: '{{ item }}'
      loop: '{{ rhel9cis_audit_watch_candidates }}'
      register: rhel9cis_audit_paths_stat
    - name: SECTION 6 | PRELIM | Set syscall and path facts
      ansible.builtin.set_fact:
        rhel9cis_syscalls_b64: "{{ ((rhel9cis_syscalls_raw.stdout_lines | select('match', '^b64:') | first | default('b64: ')).split(': ', 1) | last).split(',') | select | list or rhel9cis_fallback_syscalls }}"
        rhel9cis_syscalls_b32: "{{ ((rhel9cis_syscalls_raw.stdout_lines | select('match', '^b32:') | first | default('b32: ')).split(': ', 1) | last).split(',') | select | list }}"
        rhel9cis_audit_paths: "{{ rhel9cis_audit_paths_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  when: rhel9cis_active_rules | select('match', '^6\.') | list | length > 0
- name: 6.1.1.1 | Ensure journald service is active
  when: "'6.1.1.1' in rhel9cis_active_rules"
  tags:
    - rule_6.1.1.1
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.1.1 | AUDIT | systemd-journald is active
      ansible.builtin.systemd:
        name: systemd-journald
        state: started
- name: 6.1.1.2 | Ensure systemd-journal-remote is not in use
  when: "'6.1.1.2' in rhel9cis_active_rules"
  tags:
    - rule_6.1.1.2
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.1.2 | PATCH | Stop and mask units
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: stopped
        enabled: false
        masked: true
      loop:
        - systemd-journal-remote.socket
        - systemd-journal-remote.service
      when:
        - item in rhel9cis_unit_files
- name: 6.1.1.3 | Ensure journald is configured to send logs to rsyslog
  when: "'6.1.1.3' in rhel9cis_active_rules"
  tags:
    - rule_6.1.1.3
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.1.3 | PATCH | journald ForwardToSyslog=yes (section)
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf.d/60-cis.conf
        regexp: ^\[Journal\]\s*$
        line: '[Journal]'
        insertbefore: BOF
        firstmatch: true
        create: true
        mode: '0644'
      when: "rhel9cis_logging_system == 'rsyslog'"
    - name: 6.1.1.3 | PATCH | journald ForwardToSyslog=yes
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf.d/60-cis.conf
        regexp: ^\s*#?\s*ForwardToSyslog\s*=
        line: ForwardToSyslog=yes
        insertafter: ^\[Journal\]\s*$
        firstmatch: true
      when: "rhel9cis_logging_system == 'rsyslog'"
      notify: rhel9cis restart journald
- name: 6.1.1.4 | Ensure journald log file rotation is configured
  when: "'6.1.1.4' in rhel9cis_active_rules"
  tags:
    - rule_6.1.1.4
    - section_6
    - manual
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.1.4 | AUDIT | Collect evidence
      ansible.builtin.shell:
        cmd: "systemd-analyze cat-config systemd/journald.conf 2>/dev/null | grep -E '^(System|Runtime)(MaxUse|KeepFree|MaxFileSize)|^MaxFileSec' ; ls -l /var/log/journal 2>/dev/null ; echo 'MANUAL REVIEW REQUIRED'"
        executable: /bin/bash
      register: rhel9cis_chk_6_1_1_4
      changed_when: false
      failed_when: false
      check_mode: false
    - name: 6.1.1.4 | Record finding
      ansible.builtin.set_fact:
