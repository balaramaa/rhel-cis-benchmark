        state: present
- name: 6.2.1.2 | Ensure auditing for processes that start prior to auditd is enabled
  when: "'6.2.1.2' in rhel9cis_active_rules"
  tags:
    - rule_6.2.1.2
    - section_6
    - automated
    - level2_server
    - level2_workstation
  block:
    - name: 6.2.1.2 | PATCH | Add kernel argument(s) audit=1
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for a in audit=1; do
            if grubby --info=ALL 2>/dev/null | grep '^args=' | grep -vEq "[\" ]$a[\" ]"; then
              echo "CHANGED $a"; [ "$DRY" = 1 ] || grubby --update-kernel ALL --args="$a"
            fi
          done
        executable: /bin/bash
      register: rhel9cis_fix_6_2_1_2
      changed_when: "'CHANGED' in rhel9cis_fix_6_2_1_2.stdout"
      check_mode: false
      notify: rhel9cis flag reboot
    - name: 6.2.1.2 | PATCH | Persist audit in /etc/default/grub
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX="(?:(?!\baudit=).)*?)"$
        replace: \1 audit=1"
      notify: rhel9cis grub2 mkconfig
- name: 6.2.1.3 | Ensure audit_backlog_limit is configured
  when: "'6.2.1.3' in rhel9cis_active_rules"
  tags:
