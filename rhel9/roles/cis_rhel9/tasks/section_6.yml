- name: 6.1.3.1 | Ensure access to all logfiles has been configured
  when: "'6.1.3.1' in rhel9cis_active_rules"
  tags:
    - rule_6.1.3.1
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.1.3.1 | PATCH | Remove excess permissions on /var/log files
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          find -L /var/log -type f \( -name 'wtmp*' -o -name 'btmp*' -o -name 'lastlog*' \) -perm /0113 -print 2>/dev/null | while read -r f; do
            echo "CHANGED $f"; [ "$DRY" = 1 ] || chmod ug-x,o-wx "$f"; done
          find -L /var/log -type f ! \( -name 'wtmp*' -o -name 'btmp*' -o -name 'lastlog*' \) -perm /0137 -print 2>/dev/null | while read -r f; do
            echo "CHANGED $f"; [ "$DRY" = 1 ] || chmod u-x,g-wx,o-rwx "$f"; done
        executable: /bin/bash
      register: rhel9cis_fix_6_1_3_1
      changed_when: "'CHANGED' in rhel9cis_fix_6_1_3_1.stdout"
      check_mode: false
