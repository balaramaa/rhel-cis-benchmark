  when: "'6.3.1' in rhel9cis_active_rules"
  tags:
    - rule_6.3.1
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.3.1 | PATCH | Ensure packages present
      ansible.builtin.dnf:
        name:
          - aide
        state: present
    - name: 6.3.1 | PATCH | Initialise the AIDE database (can take several minutes)
      ansible.builtin.shell: aide --init && mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      args:
        creates: /var/lib/aide/aide.db.gz
      async: 3600
      poll: 15
- name: 6.3.2 | Ensure filesystem integrity is regularly checked
  when: "'6.3.2' in rhel9cis_active_rules"
  tags:
    - rule_6.3.2
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.3.2 | PATCH | aidecheck.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.service
        mode: '0644'
        content: |
          [Unit]
          Description=Aide Check

          [Service]
          Type=simple
          ExecStart=/usr/sbin/aide --check

          [Install]
          WantedBy=multi-user.target
    - name: 6.3.2 | PATCH | aidecheck.timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/aidecheck.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Aide check every day at 5AM

          [Timer]
          OnCalendar={{ rhel9cis_aide_schedule }}
          Unit=aidecheck.service

          [Install]
          WantedBy=multi-user.target
    - name: 6.3.2 | PATCH | Enable aidecheck.timer
      ansible.builtin.systemd:
        name: aidecheck.timer
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
- name: 6.3.3 | Ensure cryptographic mechanisms are used to protect the integrity of audit tools
  when: "'6.3.3' in rhel9cis_active_rules"
  tags:
    - rule_6.3.3
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.3.3 | PATCH | Protect audit tools in aide.conf
      ansible.builtin.blockinfile:
        path: /etc/aide.conf
        marker: '# {mark} CIS audit tools'
        block: |-
          # Audit Tools
          /sbin/auditctl p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
          /sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512
- name: 6.3.4 | Ensure report_url is configured
  when: "'6.3.4' in rhel9cis_active_rules"
  tags:
    - rule_6.3.4
    - section_6
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 6.3.4 | PATCH | report_url=syslog:{{ rhel9cis_aide_syslog_facility }}
      ansible.builtin.lineinfile:
        path: /etc/aide.conf
        regexp: '^\s*report_url=syslog:'
        line: report_url=syslog:{{ rhel9cis_aide_syslog_facility }}
        create: false
        owner: root
        group: root
        mode: '0644'
