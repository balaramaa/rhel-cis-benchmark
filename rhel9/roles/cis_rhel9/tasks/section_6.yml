    - name: 6.2.1.3 | PATCH | Add kernel argument(s) audit_backlog_limit={{ rhel9cis_audit_backlog_limit }}
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for a in audit_backlog_limit={{ rhel9cis_audit_backlog_limit }}; do
            if grubby --info=ALL 2>/dev/null | grep '^args=' | grep -vEq "[\" ]$a[\" ]"; then
              echo "CHANGED $a"; [ "$DRY" = 1 ] || grubby --update-kernel ALL --args="$a"
            fi
          done
        executable: /bin/bash
      register: rhel9cis_fix_6_2_1_3
      changed_when: "'CHANGED' in rhel9cis_fix_6_2_1_3.stdout"
      check_mode: false
      notify: rhel9cis flag reboot
    - name: 6.2.1.3 | PATCH | Persist audit_backlog_limit in /etc/default/grub
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: ^(GRUB_CMDLINE_LINUX="(?:(?!\baudit_backlog_limit=).)*?)"$
        replace: \1 audit_backlog_limit={{ rhel9cis_audit_backlog_limit }}"
      notify: rhel9cis grub2 mkconfig
