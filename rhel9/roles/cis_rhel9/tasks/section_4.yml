  tags:
    - rule_4.1.9
    - section_4
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 4.1.9 | PATCH | Stop and mask units
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: stopped
        enabled: false
