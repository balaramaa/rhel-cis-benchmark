      loop:
        - iptables.service
        - ip6tables.service
        - nftables.service
      when:
        - item in rhel9cis_unit_files
- name: 4.1.10 | Ensure firewalld logs denied packets
  when: "'4.1.10' in rhel9cis_active_rules"
  tags:
    - rule_4.1.10
    - section_4
    - automated
    - level2_server
    - level2_workstation
  block:
    - name: 4.1.10 | PATCH | Log denied packets
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          command -v firewall-cmd >/dev/null || exit 0
          if [ "$(firewall-cmd --get-log-denied)" = "off" ]; then echo CHANGED; [ "$DRY" = 1 ] || firewall-cmd --set-log-denied={{ rhel9cis_firewalld_log_denied }}; fi
        executable: /bin/bash
      register: rhel9cis_fix_4_1_10
      changed_when: "'CHANGED' in rhel9cis_fix_4_1_10.stdout"
      check_mode: false
- name: 4.1.11 | Ensure firewalld blocks ICMP timestamp requests and replies
  when: "'4.1.11' in rhel9cis_active_rules"
  tags:
    - rule_4.1.11
    - section_4
    - automated
    - level2_server
    - level2_workstation
  block:
    - name: 4.1.11 | PATCH | Block ICMP timestamp on default-target zones
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          command -v firewall-cmd >/dev/null || exit 0
          for z in $(firewall-cmd --get-active-zones 2>/dev/null | grep -v '^\s'); do
            [ "$(firewall-cmd --permanent --zone="$z" --get-target)" = "default" ] || continue
            for b in timestamp-request timestamp-reply; do
              if ! firewall-cmd --permanent --zone="$z" --query-icmp-block=$b >/dev/null 2>&1; then
                echo "CHANGED $z $b"; [ "$DRY" = 1 ] || firewall-cmd --permanent --zone="$z" --add-icmp-block=$b >/dev/null
              fi
            done
          done
        executable: /bin/bash
      register: rhel9cis_fix_4_1_11
      changed_when: "'CHANGED' in rhel9cis_fix_4_1_11.stdout"
      check_mode: false
      notify: rhel9cis reload firewalld
