# GENERATED by tools/generate.py - do not edit by hand.
# Section 3 - Network
- name: 3.1.1 | Ensure IPv6 status is identified
  when: "'3.1.1' in rhel9cis_active_rules"
  tags:
    - rule_3.1.1
    - section_3
    - manual
    - level1_server
    - level1_workstation
  block:
    - name: 3.1.1 | AUDIT | Collect evidence
      ansible.builtin.shell:
        cmd: grep -Pqs '^\h*0\b' /sys/module/ipv6/parameters/disable && echo 'IPv6 is enabled' || echo 'IPv6 is not enabled' ; echo 'MANUAL REVIEW REQUIRED'
        executable: /bin/bash
      register: rhel9cis_chk_3_1_1
      changed_when: false
      failed_when: false
      check_mode: false
    - name: 3.1.1 | Record finding
      ansible.builtin.set_fact:
        rhel9cis_findings: "{{ rhel9cis_findings + [{'id': '3.1.1', 'title': 'Ensure IPv6 status is identified (manual review - evidence attached)', 'type': 'manual', 'detail': rhel9cis_chk_3_1_1.stdout_lines[:100]}] }}"
      when: rhel9cis_chk_3_1_1.stdout | trim | length > 0
- name: 3.1.2 | Ensure wireless interfaces are not available
  when: "'3.1.2' in rhel9cis_active_rules"
  tags:
    - rule_3.1.2
    - section_3
    - automated
    - level1_server
  block:
    - name: 3.1.2 | PATCH | Disable wireless kernel drivers
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for d in /sys/class/net/*/wireless; do
            [ -d "$d" ] || continue
            mod=$(basename "$(readlink -f "$(dirname "$d")/device/driver/module")")
            [ -n "$mod" ] || continue
            if ! grep -qs "install $mod /bin/false" /etc/modprobe.d/cis-wireless.conf; then
              echo "CHANGED $mod"
              if [ "$DRY" != 1 ]; then
                printf 'install %s /bin/false\nblacklist %s\n' "$mod" "$mod" >> /etc/modprobe.d/cis-wireless.conf
                modprobe -r "$mod" 2>/dev/null || true
              fi
            fi
          done
        executable: /bin/bash
      register: rhel9cis_fix_3_1_2
      changed_when: "'CHANGED' in rhel9cis_fix_3_1_2.stdout"
      check_mode: false
- name: 3.1.3 | Ensure bluetooth services are not in use
  when: "'3.1.3' in rhel9cis_active_rules"
  tags:
    - rule_3.1.3
    - section_3
    - automated
    - level1_server
    - level2_workstation
  block:
    - name: 3.1.3 | PATCH | Remove packages
      ansible.builtin.dnf:
        name:
          - bluez
        state: absent
      when: "rhel9cis_service_remediation == 'remove'"
    - name: 3.1.3 | PATCH | Stop and mask units
      ansible.builtin.systemd:
        name: '{{ item }}'
        state: stopped
        enabled: false
        masked: true
      loop:
        - bluetooth.service
      when:
        - "rhel9cis_service_remediation == 'mask'"
        - item in rhel9cis_unit_files
