- name: 7.1.11 | Ensure world writable files and directories are secured
  when: "'7.1.11' in rhel8cis_active_rules"
  tags:
    - rule_7.1.11
    - section_7
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 7.1.11 | PATCH | Remove world-write from files / add sticky bit to world-writable dirs
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          for m in $(findmnt -nlk -o TARGET -t ext2,ext3,ext4,xfs,btrfs,vfat); do
            find "$m" -xdev \( -path /proc -o -path /sys -o -path /run -o -path '/var/lib/containers/*' \) -prune -o \
               -type f -perm -0002 -print 2>/dev/null | while read -r f; do echo "CHANGED file $f"; [ "$DRY" = 1 ] || chmod o-w "$f"; done
            find "$m" -xdev \( -path /proc -o -path /sys -o -path /run \) -prune -o \
               -type d -perm -0002 ! -perm -1000 -print 2>/dev/null | while read -r d; do echo "CHANGED dir $d"; [ "$DRY" = 1 ] || chmod a+t "$d"; done
          done
        executable: /bin/bash
      register: rhel8cis_fix_7_1_11
      changed_when: "'CHANGED' in rhel8cis_fix_7_1_11.stdout"
      check_mode: false
