- name: 7.2.1 | Ensure accounts in /etc/passwd use shadowed passwords
  when: "'7.2.1' in rhel8cis_active_rules"
  tags:
    - rule_7.2.1
    - section_7
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 7.2.1 | PATCH | Migrate passwords to /etc/shadow (pwconv)
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          if awk -F: '($2 != "x") {found=1} END {exit !found}' /etc/passwd; then echo CHANGED; [ "$DRY" = 1 ] || pwconv; fi
        executable: /bin/bash
      register: rhel8cis_fix_7_2_1
      changed_when: "'CHANGED' in rhel8cis_fix_7_2_1.stdout"
      check_mode: false
