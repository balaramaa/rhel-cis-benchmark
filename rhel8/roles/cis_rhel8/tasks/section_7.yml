          awk -F: '($2 == "") {print $1}' /etc/shadow | while read -r u; do echo "CHANGED $u"; [ "$DRY" = 1 ] || passwd -l "$u"; done
        executable: /bin/bash
      register: rhel8cis_fix_7_2_2
      changed_when: "'CHANGED' in rhel8cis_fix_7_2_2.stdout"
      check_mode: false
