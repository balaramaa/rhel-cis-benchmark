- name: 7.1.1 | Ensure access to /etc/passwd is configured
  when: "'7.1.1' in rhel8cis_active_rules"
  tags:
    - rule_7.1.1
    - section_7
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 7.1.1 | AUDIT | Stat target paths
      ansible.builtin.stat:
        path: '{{ item.path }}'
      loop:
        - path: /etc/passwd
          owner: root
          group: root
          mode: u-x,go-wx
      register: rhel8cis_stat_7_1_1
    - name: 7.1.1 | PATCH | Set owner, group and mode
      ansible.builtin.file:
        path: '{{ item.item.path }}'
        owner: '{{ item.item.owner }}'
        group: '{{ item.item.group }}'
        mode: '{{ item.item.mode }}'
      loop: '{{ rhel8cis_stat_7_1_1.results }}'
      loop_control:
        label: '{{ item.item.path }}'
      when: item.stat.exists
