- name: 7.2.8 | Ensure local interactive user home directories are configured
  when: "'7.2.8' in rhel8cis_active_rules"
  tags:
    - rule_7.2.8
    - section_7
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 7.2.8 | PATCH | Fix home directory ownership and mode
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          valid="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' -))$"
          awk -v pat="$valid" -F: '$(NF) ~ pat && $1 != "root" {print $1 ":" $(NF-1)}' /etc/passwd | while IFS=: read -r u h; do
            [ -d "$h" ] || { echo "MISSING home $h for $u"; continue; }
            o=$(stat -Lc '%U' "$h"); md=$(stat -Lc '%#a' "$h")
            [ "$o" = "$u" ] || { echo "CHANGED owner $h"; [ "$DRY" = 1 ] || chown "$u" "$h"; }
            [ $(( md & 027 )) -eq 0 ] || { echo "CHANGED mode $h"; [ "$DRY" = 1 ] || chmod g-w,o-rwx "$h"; }
          done
        executable: /bin/bash
      register: rhel8cis_fix_7_2_8
      changed_when: "'CHANGED' in rhel8cis_fix_7_2_8.stdout"
      check_mode: false
- name: 7.2.9 | Ensure local interactive user dot files access is configured
  when: "'7.2.9' in rhel8cis_active_rules"
  tags:
    - rule_7.2.9
    - section_7
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 7.2.9 | PATCH | Restrict dot file permissions
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          valid="^($(awk -F/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\/,g;p}' | paste -s -d '|' -))$"
          awk -v pat="$valid" -F: '$(NF) ~ pat {print $1 ":" $(NF-1)}' /etc/passwd | while IFS=: read -r u h; do
            [ -d "$h" ] || continue
            find "$h" -xdev -maxdepth 1 -name '.*' -type f 2>/dev/null | while read -r f; do
              case "$(basename "$f")" in
                .forward|.rhosts) if [ "{{ rhel8cis_remove_forward_rhosts | bool }}" = "True" ]; then echo "CHANGED remove $f"; [ "$DRY" = 1 ] || rm -f "$f"; else echo "FOUND $f (set rhel8cis_remove_forward_rhosts=true to delete)"; fi;;
                .netrc|.bash_history) [ $(( $(stat -Lc '%#a' "$f") & 0177 )) -eq 0 ] || { echo "CHANGED $f"; [ "$DRY" = 1 ] || chmod u-x,go-rwx "$f"; };;
                *) [ $(( $(stat -Lc '%#a' "$f") & 0133 )) -eq 0 ] || { echo "CHANGED $f"; [ "$DRY" = 1 ] || chmod u-x,go-wx "$f"; };;
              esac
            done
          done
        executable: /bin/bash
      register: rhel8cis_fix_7_2_9
      changed_when: "'CHANGED' in rhel8cis_fix_7_2_9.stdout"
      check_mode: false
