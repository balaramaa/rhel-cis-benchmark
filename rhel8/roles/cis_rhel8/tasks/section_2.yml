        owner: '{{ item.item.owner }}'
        group: '{{ item.item.group }}'
        mode: '{{ item.item.mode }}'
      loop: '{{ rhel8cis_stat_2_4_1_2.results }}'
      loop_control:
        label: '{{ item.item.path }}'
      when: item.stat.exists
