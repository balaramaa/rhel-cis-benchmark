- name: 2.3.1 | Ensure time synchronization is in use
  when: "'2.3.1' in rhel8cis_active_rules"
  tags:
    - rule_2.3.1
    - section_2
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 2.3.1 | PATCH | Ensure packages present
      ansible.builtin.dnf:
        name:
          - chrony
        state: present
    - name: 2.3.1 | PATCH | Enable chronyd
      ansible.builtin.systemd:
        name: chronyd
        enabled: true
        state: started
- name: 2.3.2 | Ensure chrony is configured
  when: "'2.3.2' in rhel8cis_active_rules"
  tags:
    - rule_2.3.2
    - section_2
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 2.3.2 | PATCH | Add time sources if none are configured
      ansible.builtin.shell:
        cmd: |
          DRY={{ ansible_check_mode | ternary('1', '0') }}

          if ! grep -Prsq '^\s*(server|pool)\s+\S+' /etc/chrony.conf /etc/chrony.d/ 2>/dev/null; then
            echo CHANGED
            if [ "$DRY" != 1 ]; then
              :
          {% for s in rhel8cis_time_sources %}
              echo '{{ s }}' >> /etc/chrony.conf
          {% endfor %}
            fi
          fi
        executable: /bin/bash
      register: rhel8cis_fix_2_3_2
      changed_when: "'CHANGED' in rhel8cis_fix_2_3_2.stdout"
      check_mode: false
      notify: rhel8cis restart chronyd
- name: 2.3.3 | Ensure chrony is not run as the root user
  when: "'2.3.3' in rhel8cis_active_rules"
  tags:
    - rule_2.3.3
    - section_2
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: "2.3.3 | PATCH | Remove '-u root' from chronyd OPTIONS"
      ansible.builtin.replace:
        path: /etc/sysconfig/chronyd
        regexp: -u\s+root\s*
      notify: rhel8cis restart chronyd
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
- name: 2.4.1.1 | Ensure cron daemon is enabled and active
  when: "'2.4.1.1' in rhel8cis_active_rules"
  tags:
    - rule_2.4.1.1
    - section_2
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 2.4.1.1 | PATCH | Enable crond
      ansible.builtin.systemd:
        name: crond
        enabled: true
        state: started
      when: "'cronie' in ansible_facts.packages"
