    - section_2
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 2.4.1.2 | AUDIT | Stat target paths
      ansible.builtin.stat:
        path: '{{ item.path }}'
      loop:
        - path: /etc/crontab
          owner: root
          group: root
          mode: u-x,go-rwx
