- name: 2.1.23 | Ensure mail transfer agents are configured for local-only mode
  when: "'2.1.23' in rhel8cis_active_rules"
  tags:
    - rule_2.1.23
    - section_2
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 2.1.23 | PATCH | Postfix inet_interfaces = loopback-only
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: ^\s*inet_interfaces\s*=
        line: inet_interfaces = loopback-only
      when: "'postfix' in ansible_facts.packages"
      notify: rhel8cis restart postfix
      register: cis_edit_result
      failed_when: "cis_edit_result is failed and 'does not exist' not in (cis_edit_result.msg | default(''))"
    - name: 2.1.23 | AUDIT | Collect evidence
      ansible.builtin.shell:
        cmd: ss -plntu | grep -P ':(25|465|587)\b' | grep -Pv '\h+(127\.0\.0\.1|\[?::1\]?):(25|465|587)\b' || true
        executable: /bin/bash
      register: rhel8cis_chk_2_1_23
      changed_when: false
      failed_when: false
      check_mode: false
    - name: 2.1.23 | Record finding
      ansible.builtin.set_fact:
        rhel8cis_findings: "{{ rhel8cis_findings + [{'id': '2.1.23', 'title': 'Ensure mail transfer agents are configured for local-only mode', 'type': 'audit', 'detail': rhel8cis_chk_2_1_23.stdout_lines[:100]}] }}"
      when: rhel8cis_chk_2_1_23.stdout | trim | length > 0
