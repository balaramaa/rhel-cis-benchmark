  tags:
    - rule_2.4.2.1
    - section_2
    - automated
    - level1_server
    - level1_workstation
  block:
    - name: 2.4.2.1 | PATCH | Create /etc/at.allow
      ansible.builtin.file:
        path: /etc/at.allow
        state: touch
        owner: root
        group: "{{ 'daemon' if 'daemon' in rhel8cis_groups else 'root' }}"
        mode: u-x,g-wx,o-rwx
        modification_time: preserve
        access_time: preserve
      when: "'at' in ansible_facts.packages"
    - name: 2.4.2.1 | PATCH | Secure /etc/at.deny if present
      ansible.builtin.file:
        path: /etc/at.deny
        owner: root
        group: "{{ 'daemon' if 'daemon' in rhel8cis_groups else 'root' }}"
        mode: u-x,g-wx,o-rwx
      when: "'at' in ansible_facts.packages and rhel8cis_at_deny.stat.exists"
