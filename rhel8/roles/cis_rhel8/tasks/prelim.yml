---
# GENERATED by tools/generate.py - do not edit by hand.
- name: PRELIM | Confirm the target runs RHEL 8 (or a compatible rebuild)
  ansible.builtin.assert:
    that:
      - "ansible_facts.os_family == 'RedHat'"
      - ansible_facts.distribution_major_version | int == 8
    fail_msg: cis_rhel8 only supports EL8; this host is {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}. Use site.yml to auto-select the right role.
    quiet: true
- name: PRELIM | Validate profile and level
  ansible.builtin.assert:
    that:
      - rhel8cis_level | int in [1, 2]
      - "rhel8cis_profile in ['server', 'workstation']"
      - "rhel8cis_service_remediation in ['mask', 'remove']"
      - "rhel8cis_logging_system in ['rsyslog', 'journald']"
    quiet: true
- name: PRELIM | Compute the active rule set
  ansible.builtin.set_fact:
    rhel8cis_active_rules: |-
      {%- set ns = namespace(out=[]) -%}
      {%- for id, r in rhel8cis_rules.items() -%}
        {%- set lvl = r[rhel8cis_profile] -%}
        {%- set in_section = rhel8cis_skip_sections | select('in', [id.split('.')[:1] | join('.'), id.split('.')[:2] | join('.'), id.split('.')[:3] | join('.'), id.split('.')[:4] | join('.'), id.split('.')[:5] | join('.')]) | list | length > 0 -%}
        {%- if lvl is not none and lvl | int <= rhel8cis_level | int
              and id not in rhel8cis_skip_rules
              and not in_section
              and (rhel8cis_only_rules | length == 0 or id in rhel8cis_only_rules)
              and (r.type == 'automated' or rhel8cis_include_manual | bool)
              and (lookup('ansible.builtin.vars', 'rhel8cis_rule_' ~ id | replace('.', '_'), default=true) | bool) -%}
          {%- set ns.out = ns.out + [id] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.out }}
    rhel8cis_findings: []
- name: PRELIM | Gather package facts
  ansible.builtin.package_facts:
    manager: auto
- name: PRELIM | List systemd unit files
  ansible.builtin.command: systemctl list-unit-files --no-legend --plain
  register: rhel8cis_units_raw
  changed_when: false
  failed_when: false
  check_mode: false
- name: PRELIM | Read groups
  ansible.builtin.getent:
    database: group
- name: PRELIM | Read UID_MIN, IPv6, authselect, crypto-policy and audit log location
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      echo "uid_min=$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"
      echo "ipv6=$(grep -qs '^0' /sys/module/ipv6/parameters/disable && echo yes || echo no)"
      echo "authselect=$(authselect current --raw 2>/dev/null)"
      echo "crypto=$(update-crypto-policies --show 2>/dev/null)"
      echo "auditlog=$(awk -F= '/^\s*log_file\s*=/{gsub(/ /,"",$2); print $2}' /etc/audit/auditd.conf 2>/dev/null)"
      echo "efi=$([ -d /sys/firmware/efi ] && echo yes || echo no)"
  register: rhel8cis_sysinfo_raw
  changed_when: false
  check_mode: false
- name: PRELIM | Parse system information
  ansible.builtin.set_fact:
    rhel8cis_sysinfo: "{{ dict(rhel8cis_sysinfo_raw.stdout_lines | select('search', '=') | map('split', '=', 1) | list) }}"
- name: PRELIM | Derive working facts
  ansible.builtin.set_fact:
    rhel8cis_unit_files: "{{ rhel8cis_units_raw.stdout_lines | map('split') | map('first') | list }}"
    rhel8cis_groups: '{{ ansible_facts.getent_group.keys() | list }}'
    rhel8cis_uid_min: "{{ rhel8cis_sysinfo.uid_min | default('1000', true) }}"
    rhel8cis_ipv6_enabled: "{{ rhel8cis_sysinfo.ipv6 == 'yes' }}"
    rhel8cis_authselect_profile_current: "{{ (rhel8cis_sysinfo.authselect | default('', true)).split() | first | default('') }}"
    rhel8cis_authselect_features: "{{ (rhel8cis_sysinfo.authselect | default('', true)).split()[1:] }}"
    rhel8cis_authselect_is_custom: "{{ (rhel8cis_sysinfo.authselect | default('', true)).startswith('custom/') }}"
    rhel8cis_authselect_dir: "{{ '/etc/authselect/' ~ ((rhel8cis_sysinfo.authselect | default('', true)).split() | first | default('none')) }}"
    rhel8cis_crypto_current: "{{ rhel8cis_sysinfo.crypto | default('DEFAULT', true) }}"
    rhel8cis_crypto_base: "{{ (rhel8cis_sysinfo.crypto | default('DEFAULT', true)).split(':')[0] }}"
    rhel8cis_crypto_modules: "{{ (rhel8cis_sysinfo.crypto | default('DEFAULT', true)).split(':')[1:] }}"
    rhel8cis_audit_log_dir: "{{ (rhel8cis_sysinfo.auditlog | default('/var/log/audit/audit.log', true)) | dirname }}"
    rhel8cis_grub_cfg: "{{ '/boot/efi/EFI/redhat/grub.cfg' if rhel8cis_sysinfo.efi == 'yes' else '/boot/grub2/grub.cfg' }}"
- name: PRELIM | Default authselect base profile
  ansible.builtin.set_fact:
    rhel8cis_authselect_base: '{{ rhel8cis_authselect_profile_current if (rhel8cis_authselect_profile_current | length > 0 and not rhel8cis_authselect_is_custom) else rhel8cis_authselect_default_base }}'
- name: PRELIM | List mounted filesystems
  ansible.builtin.command: findmnt -rn -o TARGET
  register: rhel8cis_findmnt
  changed_when: false
  check_mode: false
- name: PRELIM | Mounted filesystem list
  ansible.builtin.set_fact:
    rhel8cis_mounts: '{{ rhel8cis_findmnt.stdout_lines }}'
- name: PRELIM | Stat /etc/at.deny
  ansible.builtin.stat:
    path: /etc/at.deny
  register: rhel8cis_at_deny
- name: PRELIM | Summary
  ansible.builtin.debug:
    msg:
      - CIS Red Hat Enterprise Linux 8 Benchmark v4.0.0
      - 'Profile: Level {{ rhel8cis_level }} - {{ rhel8cis_profile }}'
      - 'Active rules: {{ rhel8cis_active_rules | length }} of {{ rhel8cis_rules | length }}'
      - 'Check mode (dry run): {{ ansible_check_mode }}'
