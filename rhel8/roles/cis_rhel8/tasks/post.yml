---
# GENERATED by tools/generate.py - do not edit by hand.
- name: POST | Run notified handlers now
  ansible.builtin.meta: flush_handlers
- name: POST | Build report
  ansible.builtin.set_fact:
    rhel8cis_report:
      host: '{{ inventory_hostname }}'
      benchmark: '{{ rhel8cis_benchmark.name }} {{ rhel8cis_benchmark.version }}'
      profile: Level {{ rhel8cis_level }} {{ rhel8cis_profile }}
      check_mode: '{{ ansible_check_mode }}'
      generated: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      active_rules: '{{ rhel8cis_active_rules }}'
      not_selected_rules: '{{ rhel8cis_rules.keys() | difference(rhel8cis_active_rules) }}'
      findings: '{{ rhel8cis_findings }}'
      reboot_recommended: '{{ rhel8cis_reboot_required | default(false) }}'
- name: POST | Write JSON report on the target
  ansible.builtin.copy:
    dest: '{{ rhel8cis_report_dir }}/cis-rhel8-report.json'
    content: '{{ rhel8cis_report | to_nice_json }}'
    mode: '0600'
  when: rhel8cis_write_report | bool
  check_mode: false
- name: POST | Copy the report to the controller
  ansible.builtin.fetch:
    src: '{{ rhel8cis_report_dir }}/cis-rhel8-report.json'
    dest: '{{ rhel8cis_report_fetch_dir }}/{{ inventory_hostname }}-cis-rhel8.json'
    flat: true
  when: rhel8cis_write_report | bool and rhel8cis_report_fetch | bool
  check_mode: false
- name: POST | Findings that need attention
  ansible.builtin.debug:
    msg: "{{ rhel8cis_findings | rejectattr('type', 'in', ['info']) | map(attribute='id') | zip(rhel8cis_findings | rejectattr('type', 'in', ['info']) | map(attribute='title')) | map('join', ' | ') | list }}"
  when: rhel8cis_findings | length > 0
- name: POST | Reboot notice
  ansible.builtin.debug:
    msg: Kernel arguments, crypto policy, SELinux or immutable audit rules changed - reboot to finish applying the benchmark.
  when: rhel8cis_reboot_required | default(false) | bool
